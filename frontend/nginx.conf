server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # Vite puts a hash in every asset name, so an asset never changes under its own address.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # One page, so anything that is not a file on disk is still the app.
  location / {
    try_files $uri /index.html;
  }

  location /api/ {
    proxy_pass http://backend:3001;
    proxy_http_version 1.1;

    # /api/search is an event stream: businesses appear as they are found. Buffering would hold them
    # back until the search ended, and the default 60s read timeout would cut a long search off.
    proxy_buffering off;
    proxy_cache off;
    proxy_set_header Connection '';
    proxy_read_timeout 10m;

    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }
}
